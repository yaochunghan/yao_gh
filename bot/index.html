<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="姚老師分身">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f3ed">
<title>姚老師的數位分身｜姚組</title>
<style>
  /* 配色對齊 yao work 公開課程頁（foundation）那套「壞掉」視覺系統：
     米白底、螢光黃綠強調色、純黑細邊框、無陰影。深色模式沿用同一個強調色，
     邊框改成淺色才看得見（主站各頁都沒有深色模式，這裡是聊天介面才保留這個切換）。*/
  :root {
    --bg: #f5f3ed;
    --paper: #fbfaf7;
    --ink: #111111;
    --muted: #66655f;
    --line: #111111;
    --accent: #d7ff3f;
    --me: #d7ff3f;
    --me-ink: #111111;
    --err: #a3392b;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #17181a;
    --paper: #202224;
    --ink: #f2f1ec;
    --muted: #9a988f;
    --line: #f2f1ec;
    --accent: #d7ff3f;
    --me: #d7ff3f;
    --me-ink: #111111;
    --err: #ff9a86;
    color-scheme: dark;
  }
  body, header, form, textarea, input, .bot, button { transition: background-color .2s, color .2s, border-color .2s; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  .app { max-width: 720px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  header h1 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: .02em; }
  header .sub { font-size: 13px; color: var(--muted); }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 13px;
  }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--accent); color: #111111; border-color: var(--ink); }
  .hdr { display: flex; gap: 8px; align-items: center; }
  #theme-btn { display: inline-flex; align-items: center; gap: 6px; }
  #theme-btn svg { flex: none; }
  button:disabled { opacity: .45; cursor: default; }

  /* 登入 */
  #login { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 360px; }
  .card h2 { font-size: 22px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.01em; }
  .card p { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card p .hl { color: var(--ink); font-size: 18px; font-weight: 800; }
  .card input {
    width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--paper); margin-bottom: 12px;
  }
  .card input:focus { outline: none; border-color: var(--accent); }
  .card button { width: 100%; padding: 12px; font-size: 15px; border-radius: 10px; }
  .ver { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .err { color: var(--err); font-size: 14px; min-height: 1.7em; margin-top: 8px; }

  /* 對話 */
  #chat { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; border: 1px solid var(--ink); white-space: pre-wrap; word-break: break-word; }
  .bot { align-self: flex-start; background: var(--paper); border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
  .note { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: b 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  form {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bg);
  }
  textarea {
    flex: 1; resize: none; font: inherit; line-height: 1.5; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 18px; background: var(--paper);
    max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  form button { padding: 10px 18px; font-size: 15px; }
  button { white-space: nowrap; }

  /* 手機：按鈕不要被擠成直排，標題和按鈕分兩行 */
  @media (max-width: 560px) {
    header { flex-wrap: wrap; align-items: center; padding: 14px 16px 12px; row-gap: 10px; }
    header > div:first-child { flex: 1 1 100%; }
    header .hdr { flex-wrap: nowrap; }
    header button { padding: 5px 12px; font-size: 13px; }
    #msgs { padding: 16px; }
    .bar { padding: 6px 16px 0; }
    .msg { max-width: 90%; }
  }
  #pin-panel { max-width: 360px; margin: 16px auto 0; padding: 0 20px; width: 100%; }
  #pin-panel h2 { font-size: 18px; margin-bottom: 12px; }
  #pin-panel .row { display: flex; gap: 10px; }
  #pin-panel .pin-note { color: var(--muted); font-size: 13px; margin: -4px 0 14px; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 20px 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>姚老師的數位分身</h1>
      <div class="sub">姚組限定 24h都在</div>
    </div>
    <div class="hdr">
      <span id="hdr-actions" class="hdr" style="display:none;">
        <button id="new-btn" type="button">開始新對話</button>
        <button id="pin-btn" type="button">改密碼</button>
        <button id="out-btn" type="button">登出</button>
      </span>
      <button id="theme-btn" type="button" aria-label="切換淺色或深色背景">深色</button>
    </div>
  </header>

  <section id="login">
    <div class="card">
      <h2>同學好</h2>
      <p>輸入<strong class="hl">學號後四碼</strong>才開始對話。分身會陪你把想法想清楚。</p>
      <input id="sno" inputmode="text" autocomplete="username" placeholder="學號後四碼">
      <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="四位數密碼">
      <button id="login-btn" class="primary" type="button">進入</button>
      <div class="err" id="login-err"></div>
      <div class="ver" id="ver"></div>
    </div>
  </section>

  <section id="chat">
    <div class="bar"><span id="who"></span><span id="left"></span></div>
    <div id="pin-panel" class="card" style="display:none;">
      <h2>修改密碼</h2>
      <p class="pin-note">新密碼只有你自己知道。系統只存加密後的版本，不會顯示密碼，老師也不會看到。</p>
      <input id="old-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="舊密碼">
      <input id="new-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="新的四位數密碼">
      <input id="new-pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="再輸入一次新密碼">
      <div class="row"><button id="pin-ok" class="primary" type="button">確認修改</button><button id="pin-cancel" type="button">取消</button></div>
      <div class="err" id="pin-err"></div>
    </div>
    <div id="msgs" aria-live="polite"></div>
    <form id="f">
      <textarea id="q" rows="1" placeholder="想問什麼？（Enter 送出，Shift+Enter 換行）"></textarea>
      <button id="send" class="primary" type="submit">送出</button>
    </form>
  </section>
</div>

<script>
const API = "https://mqixdbatdkbiabptrjww.supabase.co/functions/v1/socratic-bot";
const APP_VERSION = "v1.18";
const IDLE_MINUTES = 20; // 閒置多久自動登出
let knowledgeUpdated = "";
function fmtUpdated(iso) {
  try {
    const d = new Date(iso);
    const p = new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d);
    const g = (t) => (p.find(x => x.type === t) || {}).value || "";
    return `${g("month")} 月 ${g("day")} 日 ${g("hour")}:${g("minute")}`;
  } catch { return ""; }
}
function showUpdated(iso) {
  if (!iso) return;
  knowledgeUpdated = fmtUpdated(iso);
  $("ver").textContent = `${APP_VERSION}｜教學資料更新：${knowledgeUpdated}`;
  if (!$("left").dataset.count) $("left").textContent = `教學資料更新：${knowledgeUpdated}`;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const $ = (id) => document.getElementById(id);

// 淺色／深色背景
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  const moon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  const sun = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  $("theme-btn").innerHTML = t === "dark" ? sun + "<span>淺色</span>" : moon + "<span>深色</span>";
}
applyTheme(store.get("sb_theme") ||
  (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme-btn").onclick = () => {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  store.set("sb_theme", t);
  applyTheme(t);
};
let sessionToken = "", studentNo = null, studentName = "", studentGrade = "", convId = null, busy = false;

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}

async function call(payload) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ student_no: studentNo, token: sessionToken, ...payload }),
  });
  const data = await r.json().catch(() => ({}));
  if (data.relogin) {
    note(data.error);
    setTimeout(logout, 2500);
    throw Object.assign(new Error(data.error), { silent: true });
  }
  if (!r.ok) throw new Error(data.error || "連線有問題，請稍後再試。");
  return data;
}

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "bot");
  d.textContent = text;
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return d;
}
function note(text) {
  const d = document.createElement("div");
  d.className = "note";
  d.textContent = text;
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}
// 依台北時間打招呼，加一句簡單的關心
function greet() {
  let h = new Date().getHours();
  try { h = Number(new Intl.DateTimeFormat("en-US", { hour: "numeric", hourCycle: "h23", timeZone: "Asia/Taipei" }).format(new Date())); } catch {}
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const y5 = studentGrade === "大五";
  let hello, care;
  if (h >= 5 && h < 11) {
    hello = "早安";
    care = pick(["吃早餐了嗎？", "昨晚睡得好嗎？", "今天也慢慢來就好。"]);
  } else if (h >= 11 && h < 14) {
    hello = "午安";
    care = pick(["午餐吃了嗎？", y5 ? "吃飽再做，比較有力氣。" : "吃飽再畫，比較有力氣。", "中午記得休息一下。"]);
  } else if (h >= 14 && h < 18) {
    hello = "午安";
    care = pick(["下午有點累的話，起來走一走、喝口水。", "今天的課還順利嗎？", "下午容易恍神，先伸個懶腰吧。"]);
  } else if (h >= 18 && h < 23) {
    hello = "晚上好";
    care = pick(["晚餐吃了嗎？", "今天辛苦了。", y5 ? "做累了記得讓眼睛休息一下。" : "畫累了記得讓眼睛休息一下。"]);
  } else {
    hello = "這麼晚還在努力";
    care = pick(["今天不要熬太晚，身體比進度重要。", y5 ? "做完這一段就早點睡吧。" : "畫完這一段就早點睡吧。"]);
  }
  const ask = y5
    ? "畢業設計最近進行得怎麼樣？有什麼卡住的地方，或對創作有什麼想法、疑問，都可以跟我聊聊。"
    : "音樂繪畫畫到哪裡了？有什麼卡住的地方，或對設計、創作有什麼疑問，都可以跟我聊聊。";
  add("assistant", `${hello}，${studentName}！${care}\n${ask}`);
}

async function enter(sno, pin) {
  studentNo = sno;
  const { name, updated, token, grade } = await call({ action: "login", pin });
  studentGrade = grade || "";
  sessionToken = token || "";
  studentName = name;
  showUpdated(updated);
  $("login").style.display = "none";
  $("chat").style.display = "flex";
  $("hdr-actions").style.display = "flex";
  $("who").textContent = name;
  convId = uuid(); // 每次登入都是新的對話，不載入之前的內容
  $("msgs").innerHTML = "";
  greet();
  resetIdle();
  $("q").focus();
}

$("login-btn").onclick = async () => {
  const sno = $("sno").value.trim();
  const pin = $("pin").value.trim();
  if (!sno) { $("sno").focus(); return; }
  if (!/^\d{4}$/.test(pin)) { $("login-err").textContent = "請輸入四位數密碼。"; $("pin").focus(); return; }
  $("login-err").textContent = "";
  $("login-btn").disabled = true;
  try { await enter(sno, pin); }
  catch (e) { $("login-err").textContent = e.message; studentNo = null; $("pin").value = ""; }
  finally { $("login-btn").disabled = false; }
};
$("sno").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) $("pin").focus();
});
$("pin").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) $("login-btn").click();
});

// 修改密碼
function closePin() {
  $("pin-panel").style.display = "none";
  ["old-pin", "new-pin", "new-pin2"].forEach(id => $(id).value = "");
  $("pin-err").textContent = "";
}
$("pin-btn").onclick = () => {
  const open = $("pin-panel").style.display !== "none";
  if (open) { closePin(); return; }
  $("pin-panel").style.display = "block";
  $("old-pin").focus();
};
$("pin-cancel").onclick = closePin;
$("pin-ok").onclick = async () => {
  const oldPin = $("old-pin").value.trim(), newPin = $("new-pin").value.trim();
  if (!/^\d{4}$/.test(newPin)) { $("pin-err").textContent = "新密碼要是四位數字。"; return; }
  if (newPin !== $("new-pin2").value.trim()) { $("pin-err").textContent = "兩次輸入的新密碼不一樣。"; return; }
  $("pin-ok").disabled = true;
  try {
    await call({ action: "change_pin", old_pin: oldPin, new_pin: newPin });
    closePin();
    note("密碼改好了，下次登入請用新密碼。");
  } catch (e) {
    if (!e.silent) $("pin-err").textContent = e.message;
  } finally { $("pin-ok").disabled = false; }
};

$("new-btn").onclick = () => {
  if (busy) return;
  convId = uuid();
  $("msgs").innerHTML = "";
  greet();
  $("q").focus();
};
function logout() {
  store.del("sb_sno"); store.del("sb_conv"); // 清掉舊版留下的紀錄
  location.reload();
}
$("out-btn").onclick = logout;

// 閒置自動登出
let idleTimer = null;
function resetIdle() {
  if (!studentNo) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(logout, IDLE_MINUTES * 60 * 1000);
}
["keydown", "click", "touchstart"].forEach(ev => document.addEventListener(ev, resetIdle, { passive: true }));

const q = $("q");
if (matchMedia("(pointer: coarse)").matches) q.placeholder = "想問什麼？";
q.addEventListener("input", () => {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 160) + "px";
});
q.addEventListener("keydown", e => {
  // 中文輸入法選字時不要送出
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    $("f").requestSubmit();
  }
});

$("f").onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true;
  add("user", text);
  q.value = ""; q.style.height = "auto";
  const t = document.createElement("div");
  t.className = "msg bot typing";
  t.innerHTML = "<span></span><span></span><span></span>";
  $("msgs").appendChild(t);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  try {
    const { reply, remaining } = await call({ action: "chat", conversation_id: convId, message: text });
    t.remove();
    add("assistant", reply);
    $("left").dataset.count = "1";
    $("left").textContent = remaining >= 999 ? "老師測試模式" : `今天還可以問 ${remaining} 次`;
  } catch (err) {
    t.remove();
    if (!err.silent) note(err.message);
  } finally {
    busy = false; $("send").disabled = false; q.focus();
  }
};

$("ver").textContent = APP_VERSION;
fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "info" }) })
  .then(r => r.json()).then(d => showUpdated(d.updated)).catch(() => {});

store.del("sb_sno"); store.del("sb_conv"); // 不再記住學號，每次都要重新登入
</script>
</body>
</html>
