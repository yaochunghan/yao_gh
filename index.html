<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>YAO Chung-Han's GH</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }
  span {
    font-size: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
</style>
</head>
<body>
  <span id="txt">YAO Chung-Han's GH</span>
  <script>
    const colors = ["#000000", "#ffffff", "#808080", "#ffffff"];
    let i = 0;
    const el = document.getElementById("txt");
    setInterval(() => {
      i = (i + 1) % colors.length;
      el.style.color = colors[i];
    }, 100);
  </script>
</body>
</html>
